  <style>
    .phrase { opacity:0; animation: cycle 36s linear infinite; }
    .p1 { animation-delay:0s; }
    .p2 { animation-delay:-30s; }
    .p3 { animation-delay:-24s; }
    .p4 { animation-delay:-18s; }
    .p5 { animation-delay:-12s; }
    .p6 { animation-delay:-6s; }
    @keyframes cycle {
      0%,16.65% { opacity:1; }
      16.67%,100% { opacity:0; }
    }
    .reveal { width:0; animation:type 6s infinite; }
    .moving { animation:move 6s infinite; }
    @keyframes type {
      0% { width:0; }
      55%,70% { width:var(--w); }
      95%,100% { width:0; }
    }
    @keyframes move {
      0% { transform:translateX(0); }
      55%,70% { transform:translateX(var(--w)); }
      95%,100% { transform:translateX(0); }
    }
    .blink {
      fill:#A855F7;
      animation:blink .7s step-end infinite;
    }
    @keyframes blink {
      0%,49% { opacity:1; }
      50%,100% { opacity:0; }
    }
    .r1,.c1 { --w:561px; animation-timing-function:steps(33,end); }
    .r2,.c2 { --w:323px; animation-timing-function:steps(19,end); }
    .r3,.c3 { --w:221px; animation-timing-function:steps(13,end); }
    .r4,.c4 { --w:323px; animation-timing-function:steps(19,end); }
    .r5,.c5 { --w:476px; animation-timing-function:steps(28,end); }
    .r6,.c6 { --w:340px; animation-timing-function:steps(20,end); }
  </style>

