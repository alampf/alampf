<svg xmlns="http://www.w3.org/2000/svg"
     width="850"
     height="80"
     viewBox="0 0 850 80"
     role="img"
     aria-label="Presentación animada de Alan Patlani Flores">

  <defs>
    <linearGradient id="gradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <clipPath id="clip1">
      <rect class="reveal r1" x="197" y="0" height="80"/>
    </clipPath>
    <clipPath id="clip2">
      <rect class="reveal r2" x="293" y="0" height="80"/>
    </clipPath>
    <clipPath id="clip3">
      <rect class="reveal r3" x="335" y="0" height="80"/>
    </clipPath>
    <clipPath id="clip4">
      <rect class="reveal r4" x="293" y="0" height="80"/>
    </clipPath>
    <clipPath id="clip5">
      <rect class="reveal r5" x="230" y="0" height="80"/>
    </clipPath>
    <clipPath id="clip6">
      <rect class="reveal r6" x="286" y="0" height="80"/>
    </clipPath>
  </defs>

  <style>
    .text {
      font-family: "Courier New", monospace;
      font-size: 23px;
      font-weight: bold;
      letter-spacing: 0;
      fill: url(#gradient);
      dominant-baseline: middle;
    }

    .phrase {
      opacity: 0;
      animation: phraseCycle 36s steps(1, end) infinite;
    }

    .p1 { animation-delay: 0s; }
    .p2 { animation-delay: -30s; }
    .p3 { animation-delay: -24s; }
    .p4 { animation-delay: -18s; }
    .p5 { animation-delay: -12s; }
    .p6 { animation-delay: -6s; }

    @keyframes phraseCycle {
      0%, 16.65% { opacity: 1; }
      16.67%, 100% { opacity: 0; }
    }

    .reveal {
      width: 0;
    }

    .r1 { animation: typing1 6s infinite; }
    .r2 { animation: typing2 6s infinite; }
    .r3 { animation: typing3 6s infinite; }
    .r4 { animation: typing4 6s infinite; }
    .r5 { animation: typing5 6s infinite; }
    .r6 { animation: typing6 6s infinite; }

    @keyframes typing1 {
      0% { width: 0; }
      55% { width: 456px; }
      70% { width: 456px; }
      95%, 100% { width: 0; }
    }

    @keyframes typing2 {
      0% { width: 0; }
      55% { width: 264px; }
      70% { width: 264px; }
      95%, 100% { width: 0; }
    }

    @keyframes typing3 {
      0% { width: 0; }
      55% { width: 180px; }
      70% { width: 180px; }
      95%, 100% { width: 0; }
    }

    @keyframes typing4 {
      0% { width: 0; }
      55% { width: 264px; }
      70% { width: 264px; }
      95%, 100% { width: 0; }
    }

    @keyframes typing5 {
      0% { width: 0; }
      55% { width: 390px; }
      70% { width: 390px; }
      95%, 100% { width: 0; }
    }

    @keyframes typing6 {
      0% { width: 0; }
      55% { width: 278px; }
      70% { width: 278px; }
      95%, 100% { width: 0; }
    }

    .r1 { animation-timing-function: steps(33, end); }
    .r2 { animation-timing-function: steps(19, end); }
    .r3 { animation-timing-function: steps(13, end); }
    .r4 { animation-timing-function: steps(19, end); }
    .r5 { animation-timing-function: steps(28, end); }
    .r6 { animation-timing-function: steps(20, end); }

    .cursor {
      fill: #A855F7;
      animation:
        cursorMove 6s infinite,
        blink 0.7s steps(1, end) infinite;
    }

    .c1 { --w:456px; animation-timing-function: steps(33, end); }
    .c2 { --w:264px; animation-timing-function: steps(19, end); }
    .c3 { --w:180px; animation-timing-function: steps(13, end); }
    .c4 { --w:264px; animation-timing-function: steps(19, end); }
    .c5 { --w:390px; animation-timing-function: steps(28, end); }
    .c6 { --w:278px; animation-timing-function: steps(20, end); }

    @keyframes cursorMove {
      0% { transform: translateX(0); }
      55%, 70% { transform: translateX(var(--w)); }
      95%, 100% { transform: translateX(0); }
    }

    @keyframes blink {
      0%, 49% { fill-opacity: 1; }
      50%, 100% { fill-opacity: 0; }
    }
  </style>

  <!-- FRASE 1 -->
  <g class="phrase p1">
    <text class="text"
          x="197" y="40"
          clip-path="url(#clip1)">
      Desarrollando aplicaciones reales
    </text>
    <rect class="cursor c1"
          x="197" y="26"
          width="9" height="27"/>
  </g>

  <!-- FRASE 2 -->
  <g class="phrase p2">
    <text class="text"
          x="293" y="40"
          clip-path="url(#clip2)">
      Python, Django, CSS
    </text>
    <rect class="cursor c2"
          x="293" y="26"
          width="9" height="27"/>
  </g>

  <!-- FRASE 3 -->
  <g class="phrase p3">
    <text class="text"
          x="335" y="40"
          clip-path="url(#clip3)">
      Flutter, Dart
    </text>
    <rect class="cursor c3"
          x="335" y="26"
          width="9" height="27"/>
  </g>

  <!-- FRASE 4 -->
  <g class="phrase p4">
    <text class="text"
          x="293" y="40"
          clip-path="url(#clip4)">
      Angular, TypeScript
    </text>
    <rect class="cursor c4"
          x="293" y="26"
          width="9" height="27"/>
  </g>

  <!-- FRASE 5 -->
  <g class="phrase p5">
    <text class="text"
          x="230" y="40"
          clip-path="url(#clip5)">
      Tratando de mejorar cada día
    </text>
    <rect class="cursor c5"
          x="230" y="26"
          width="9" height="27"/>
  </g>

  <!-- FRASE 6 -->
  <g class="phrase p6">
    <text class="text"
          x="286" y="40"
          clip-path="url(#clip6)">
      Aprendiendo cada día
    </text>
    <rect class="cursor c6"
          x="286" y="26"
          width="9" height="27"/>
  </g>
</svg>
