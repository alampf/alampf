
<svg xmlns="http://www.w3.org/2000/svg"
     width="850"
     height="80"
     viewBox="0 0 850 80"
     role="img"
     aria-label="Presentación animada de Alan Patlani Flores">

  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <clipPath id="clip1">
      <rect class="reveal" style="--w:462px;--n:33" x="194" y="0" height="80"/>
    </clipPath>
    <clipPath id="clip2">
      <rect class="reveal" style="--w:266px;--n:19" x="292" y="0" height="80"/>
    </clipPath>
    <clipPath id="clip3">
      <rect class="reveal" style="--w:182px;--n:13" x="334" y="0" height="80"/>
    </clipPath>
    <clipPath id="clip4">
      <rect class="reveal" style="--w:266px;--n:19" x="292" y="0" height="80"/>
    </clipPath>
    <clipPath id="clip5">
      <rect class="reveal" style="--w:392px;--n:28" x="229" y="0" height="80"/>
    </clipPath>
    <clipPath id="clip6">
      <rect class="reveal" style="--w:280px;--n:20" x="285" y="0" height="80"/>
    </clipPath>
  </defs>

  <style>
    .phrase {
      opacity: 0;
      animation: phraseCycle 36s linear infinite;
    }

    .p1 { animation-delay: 0s; }
    .p2 { animation-delay: -30s; }
    .p3 { animation-delay: -24s; }
    .p4 { animation-delay: -18s; }
    .p5 { animation-delay: -12s; }
    .p6 { animation-delay: -6s; }

    @keyframes phraseCycle {
      0%, 16.65% { opacity: 1; }
      16.67%, 100% { opacity: 0; }
    }

    .text {
      font-family: "Courier New", monospace;
      font-size: 23px;
      font-weight: bold;
      letter-spacing: 0;
      fill: url(#gradient);
      dominant-baseline: middle;
    }

    .reveal {
      width: 0;
      animation: typing 6s linear infinite;
    }

    @keyframes typing {
      0% {
        width: 0;
      }
      55% {
        width: var(--w);
      }
      70% {
        width: var(--w);
      }
      95%, 100% {
        width: 0;
      }
    }

    .cursor {
      fill: #A855F7;
      animation:
        cursorMove 6s linear infinite,
        blink 0.7s step-end infinite;
    }

    @keyframes cursorMove {
      0% {
        transform: translateX(0);
      }
      55%, 70% {
        transform: translateX(var(--w));
      }
      95%, 100% {
        transform: translateX(0);
      }
    }

    @keyframes blink {
      0%, 49% { fill-opacity: 1; }
      50%, 100% { fill-opacity: 0; }
    }
  </style>

  <!-- FRASE 1 -->
  <g class="phrase p1">
    <text class="text" x="194" y="40"
          clip-path="url(#clip1)"
          textLength="462"
          lengthAdjust="spacing">
      Desarrollando aplicaciones reales
    </text>
    <rect class="cursor"
          x="194" y="26"
          width="9" height="27"
          style="--w:462px"/>
  </g>

  <!-- FRASE 2 -->
  <g class="phrase p2">
    <text class="text" x="292" y="40"
          clip-path="url(#clip2)"
          textLength="266"
          lengthAdjust="spacing">
      Python, Django, CSS
    </text>
    <rect class="cursor"
          x="292" y="26"
          width="9" height="27"
          style="--w:266px"/>
  </g>

  <!-- FRASE 3 -->
  <g class="phrase p3">
    <text class="text" x="334" y="40"
          clip-path="url(#clip3)"
          textLength="182"
          lengthAdjust="spacing">
      Flutter, Dart
    </text>
    <rect class="cursor"
          x="334" y="26"
          width="9" height="27"
          style="--w:182px"/>
  </g>

  <!-- FRASE 4 -->
  <g class="phrase p4">
    <text class="text" x="292" y="40"
          clip-path="url(#clip4)"
          textLength="266"
          lengthAdjust="spacing">
      Angular, TypeScript
    </text>
    <rect class="cursor"
          x="292" y="26"
          width="9" height="27"
          style="--w:266px"/>
  </g>

  <!-- FRASE 5 -->
  <g class="phrase p5">
    <text class="text" x="229" y="40"
          clip-path="url(#clip5)"
          textLength="392"
          lengthAdjust="spacing">
      Tratando de mejorar cada día
    </text>
    <rect class="cursor"
          x="229" y="26"
          width="9" height="27"
          style="--w:392px"/>
  </g>

  <!-- FRASE 6 -->
  <g class="phrase p6">
    <text class="text" x="285" y="40"
          clip-path="url(#clip6)"
          textLength="280"
          lengthAdjust="spacing">
      Aprendiendo cada día
    </text>
    <rect class="cursor"
          x="285" y="26"
          width="9" height="27"
          style="--w:280px"/>
  </g>
</svg>
