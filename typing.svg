
<svg xmlns="http://www.w3.org/2000/svg"
     width="850" height="75"
     viewBox="0 0 850 75"
     role="img"
     aria-label="Animación de presentación">

  <defs>
    <linearGradient id="gradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <clipPath id="typingClip">
      <rect x="0" y="0" width="0" height="75">
        <animate
          attributeName="width"
          values="0;850;850;0"
          keyTimes="0;0.55;0.75;1"
          dur="6s"
          repeatCount="indefinite"
          calcMode="discrete"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .pixel-text {
      font-family: 'Courier New', monospace;
      font-size: 23px;
      font-weight: 900;
      letter-spacing: 1px;
      fill: url(#gradient);
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .phrase {
      opacity: 0;
      animation: phraseCycle 36s linear infinite;
    }

    .phrase1 { animation-delay: 0s; }
    .phrase2 { animation-delay: -30s; }
    .phrase3 { animation-delay: -24s; }
    .phrase4 { animation-delay: -18s; }
    .phrase5 { animation-delay: -12s; }
    .phrase6 { animation-delay: -6s; }

    @keyframes phraseCycle {
      0%, 16.65% { opacity: 1; }
      16.67%, 100% { opacity: 0; }
    }

    .cursor {
      fill: #A855F7;
      animation: blink 0.8s steps(1) infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <g clip-path="url(#typingClip)">
    <text class="pixel-text phrase phrase1"
          x="425" y="38">
      Desarrollando aplicaciones reales
    </text>

    <text class="pixel-text phrase phrase2"
          x="425" y="38">
      Python, Django, CSS
    </text>

    <text class="pixel-text phrase phrase3"
          x="425" y="38">
      Flutter, Dart
    </text>

    <text class="pixel-text phrase phrase4"
          x="425" y="38">
      Angular, TypeScript
    </text>

    <text class="pixel-text phrase phrase5"
          x="425" y="38">
      Tratando de mejorar cada día
    </text>

    <text class="pixel-text phrase phrase6"
          x="425" y="38">
      Aprendiendo cada día
    </text>
  </g>

  <rect class="cursor"
        x="830" y="26"
        width="10" height="25"/>
</svg>
