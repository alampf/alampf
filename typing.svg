<svg xmlns="http://www.w3.org/2000/svg"
     width="850" height="90"
     viewBox="0 0 850 90"
     role="img"
     aria-label="Presentación animada de Alan Patlani Flores">

  <defs>
    <linearGradient id="gradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <style>
    .text {
      font-family: monospace;
      font-size: 23px;
      font-weight: bold;
      fill: url(#gradient);
      text-anchor: start;
      dominant-baseline: middle;
    }

    .cursor {
      fill: #A855F7;
    }
  </style>

  <!-- FRASE 1 -->
  <svg x="220" y="15" width="410" height="60"
       viewBox="0 0 410 60">
    <defs>
      <clipPath id="clip1">
        <rect x="0" y="0" height="60">
          <animate attributeName="width"
                   values="0;410;410;0;0"
                   keyTimes="0;0.09;0.13;0.165;1"
                   dur="36s"
                   calcMode="discrete"
                   repeatCount="indefinite"/>
        </rect>
      </clipPath>
    </defs>

    <g clip-path="url(#clip1)">
      <text class="text" x="0" y="30">
        Desarrollando aplicaciones reales
      </text>
    </g>
  </svg>

  <!-- FRASE 2 -->
  <svg x="290" y="15" width="270" height="60"
       viewBox="0 0 270 60">
    <defs>
      <clipPath id="clip2">
        <rect x="0" y="0" height="60">
          <animate attributeName="width"
                   values="0;0;270;270;0;0"
                   keyTimes="0;0.167;0.257;0.297;0.332;1"
                   dur="36s"
                   calcMode="discrete"
                   repeatCount="indefinite"/>
        </rect>
      </clipPath>
    </defs>

    <g clip-path="url(#clip2)">
      <text class="text" x="0" y="30">
        Python, Django, CSS
      </text>
    </g>
  </svg>

  <!-- FRASE 3 -->
  <svg x="330" y="15" width="190" height="60"
       viewBox="0 0 190 60">
    <defs>
      <clipPath id="clip3">
        <rect x="0" y="0" height="60">
          <animate attributeName="width"
                   values="0;0;190;190;0;0"
                   keyTimes="0;0.333;0.423;0.463;0.498;1"
                   dur="36s"
                   calcMode="discrete"
                   repeatCount="indefinite"/>
        </rect>
      </clipPath>
    </defs>

    <g clip-path="url(#clip3)">
      <text class="text" x="0" y="30">
        Flutter, Dart
      </text>
    </g>
  </svg>

  <!-- FRASE 4 -->
  <svg x="290" y="15" width="270" height="60"
       viewBox="0 0 270 60">
    <defs>
      <clipPath id="clip4">
        <rect x="0" y="0" height="60">
          <animate attributeName="width"
                   values="0;0;270;270;0;0"
                   keyTimes="0;0.5;0.59;0.63;0.665;1"
                   dur="36s"
                   calcMode="discrete"
                   repeatCount="indefinite"/>
        </rect>
      </clipPath>
    </defs>

    <g clip-path="url(#clip4)">
      <text class="text" x="0" y="30">
        Angular, TypeScript
      </text>
    </g>
  </svg>

  <!-- FRASE 5 -->
  <svg x="230" y="15" width="390" height="60"
       viewBox="0 0 390 60">
    <defs>
      <clipPath id="clip5">
        <rect x="0" y="0" height="60">
          <animate attributeName="width"
                   values="0;0;390;390;0;0"
                   keyTimes="0;0.667;0.757;0.797;0.832;1"
                   dur="36s"
                   calcMode="discrete"
                   repeatCount="indefinite"/>
        </rect>
      </clipPath>
    </defs>

    <g clip-path="url(#clip5)">
      <text class="text" x="0" y="30">
        Tratando de mejorar cada día
      </text>
    </g>
  </svg>

  <!-- FRASE 6 -->
  <svg x="290" y="15" width="270" height="60"
       viewBox="0 0 270 60">
    <defs>
      <clipPath id="clip6">
        <rect x="0" y="0" height="60">
          <animate attributeName="width"
                   values="0;0;270;270;0;0"
                   keyTimes="0;0.833;0.923;0.963;0.998;1"
                   dur="36s"
                   calcMode="discrete"
                   repeatCount="indefinite"/>
        </rect>
      </clipPath>
    </defs>

    <g clip-path="url(#clip6)">
      <text class="text" x="0" y="30">
        Aprendiendo cada día
      </text>
    </g>
  </svg>

</svg>
